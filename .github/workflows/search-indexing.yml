name: Search and AI discovery

on:
  push:
    branches: [main, master]
    paths:
      - "**.html"
      - "robots.txt"
      - "llms.txt"
      - "ai-index.json"
      - "search-indexing.config.json"
      - "scripts/**"
      - ".github/workflows/search-indexing.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-indexing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-and-submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Validate discovery files
        run: node scripts/validate-search.mjs

      - name: Save regenerated sitemap
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: refresh sitemap"
            git push
          fi

      - name: Notify IndexNow and Baidu
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: node scripts/submit-search-engines.mjs
